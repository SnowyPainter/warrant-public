experiment:
  name: permission_decomposition_main_budget
  seeds: [7, 17, 37]
  device: cuda:0
  output_root: experiments/permission_decomposition/outputs_main_budget
  skip_completed: true

selection:
  domains: [ctdg]
  variants: [open_path_no_gate]

training:
  implementation: reference
  progress: false
  max_examples: 65536
  epochs: 30
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  history_len: 50
  eval_ratio: 0.2
  dropout: 0.1

warrant:
  gate_init: 0.95
  gate_leak: 0.05

tkg:
  strict_time_history: false

variants:
  open_path_no_gate: {description: "Main-benchmark budget metric-facing edge path with all permission gates fixed to one."}

tasks:
  ctdg:
    dataset: lastfm
    path: data/processed/ctdg/lastfm/events.csv
    model: DyGFormer
    model_config:
      num_nodes: auto
      edge_feat_dim: 1
      hidden_dim: 128
      time_dim: 32
      num_layers: 2
