experiment:
  name: permission_decomposition
  seeds: [7, 17, 37]
  device: cuda:0
  output_root: experiments/permission_decomposition/outputs
  skip_completed: true

selection:
  domains: [ctdg]
  variants: [base, open_path_no_gate, scalar_gate, item_only_gate, normalized_gate, correct_path_warrant, generic_open_path, combined_full]

training:
  implementation: reference
  progress: false
  max_examples: 32768
  epochs: 10
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  history_len: 50
  eval_ratio: 0.2
  dropout: 0.1

warrant:
  gate_init: 0.95
  gate_leak: 0.05

tkg:
  strict_time_history: false

variants:
  base: {description: "No added edge path."}
  open_path_no_gate: {description: "Metric-facing edge path with g=1."}
  scalar_gate: {description: "One query-conditioned scalar shared across items."}
  item_only_gate: {description: "Item-conditioned gate without current-query conditioning."}
  normalized_gate: {description: "Query-item gate with total attention mass renormalized."}
  correct_path_warrant: {description: "Edge permission only; generic attention Warrant disabled."}
  generic_open_path: {description: "Generic attention Warrant plus edge path with g=1."}
  combined_full: {description: "Generic attention Warrant plus learned edge permission."}

tasks:
  ctdg:
    dataset: lastfm
    path: data/processed/ctdg/lastfm/events.csv
    model: DyGFormer
    model_config:
      num_nodes: auto
      edge_feat_dim: 1
      hidden_dim: 128
      time_dim: 32
      num_layers: 2

