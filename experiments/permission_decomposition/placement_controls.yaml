experiment:
  name: placement_controls_main_budget
  seeds: [7, 17, 37]
  device: cuda:0
  output_root: experiments/permission_decomposition/outputs_placement_controls
  skip_completed: true
selection:
  domains: [ctdg]
  variants: [generic_qk_warrant, generic_open_path, combined_full]
training:
  implementation: reference
  progress: true
  max_examples: 65536
  epochs: 30
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  history_len: 50
  eval_ratio: 0.2
  dropout: 0.1
  save_checkpoint: true
  track_gradients: false
  eval_every: 30
warrant: {gate_init: 0.95, gate_leak: 0.05}
tkg: {strict_time_history: false}
variants:
  generic_qk_warrant: {description: "Generic attention gate with metric-facing path closed."}
  generic_open_path: {description: "Generic attention gate plus metric-facing ungated path."}
  combined_full: {description: "Generic attention gate plus metric-facing permission."}
tasks:
  ctdg:
    dataset: lastfm
    path: data/processed/ctdg/lastfm/events.csv
    model: DyGFormer
    model_config: {num_nodes: auto, edge_feat_dim: 1, hidden_dim: 128, time_dim: 32, num_layers: 2}
