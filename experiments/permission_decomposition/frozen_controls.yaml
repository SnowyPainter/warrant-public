experiment:
  name: frozen_permission_controls
  seeds: [7, 17, 37]
  device: cuda:0
  output_root: experiments/permission_decomposition/outputs_frozen_controls
training:
  implementation: reference
  progress: true
  max_examples: 65536
  epochs: 30
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  history_len: 50
  eval_ratio: 0.2
  dropout: 0.1
  eval_every: 30
warrant: {gate_init: 0.95, gate_leak: 0.05}
tkg: {strict_time_history: false}
variants:
  open_path_no_gate: {description: "Stage-one ungated metric-facing path."}
  correct_path_warrant: {description: "Frozen-backbone learned permission."}
  attention_adapter: {description: "Frozen-backbone attention-only adapter."}
tasks:
  rag:
    dataset: hotpotqa
    path: data/processed/rag/hotpotqa/examples.jsonl
    model: FiD
    model_config: {vocab_size: 32128, hidden_dim: 96, fusion_layers: 1, batch_size: 512, eval_batch_size: 512, gate_leak: 0.7, max_passages: 5, question_len: 32, passage_len: 48}
  tkg:
    dataset: gdelt
    path: data/processed/tkg/gdelt/facts.csv
    model: xERTE
    model_config: {num_entities: auto, num_relations: auto, hidden_dim: 128, time_dim: 32, expansion_layers: 2}
