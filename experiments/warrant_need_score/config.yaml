experiment:
  name: warrant_need_score
  seeds: [7, 17, 37]
  device: cuda:0
  output_root: experiments/warrant_need_score/outputs
  skip_completed: true

selection:
  domains: all
  variants: all

training:
  implementation: reference
  progress: true
  max_examples: 10000
  epochs: 10
  batch_size: 2048
  learning_rate: 0.001
  weight_decay: 0.0
  history_len: 50
  eval_ratio: 0.2
  dropout: 0.1
  save_checkpoint: true
  checkpoint_name: checkpoint.pt

warrant:
  gate_init: 0.95
  gate_leak: 0.05

tkg:
  strict_time_history: false

variants:
  base:
    description: No Warrant and no localized permission path.
  generic_qk_warrant:
    description: Warrant is enabled only on generic query-key attention; the domain-localized metric path is disabled.
  open_path_no_gate:
    description: The localized metric-facing contribution path is opened with g=1 and no learned permission gate.
  correct_path_warrant:
    description: Warrant is placed on the metric-facing weighted value path.
  shuffled_pairing:
    description: The correct path is kept, but query-item pairing is deliberately mismatched at evaluation.

tasks:
  ctdg:
    dataset: lastfm
    path: data/processed/ctdg/lastfm/events.csv
    model: DyGFormer
    model_config:
      num_nodes: auto
      edge_feat_dim: 1
      hidden_dim: 128
      time_dim: 32
      num_layers: 2
  mtpp:
    dataset: retweets
    path: data/processed/mtpp/retweets/events.csv
    model: AttNHP
    model_config:
      num_event_types: auto
      hidden_dim: 128
      time_dim: 32
      num_heads: 4
  rag:
    dataset: hotpotqa
    path: data/processed/rag/hotpotqa/examples.jsonl
    model: FiD
    model_config:
      vocab_size: 32128
      hidden_dim: 96
      fusion_layers: 1
      batch_size: 512
      eval_batch_size: 512
      gate_leak: 0.7
      max_passages: 5
      question_len: 32
      passage_len: 48
      support_loss_weight: 1.0
      gate_loss_weight: 0.0
  stpp:
    dataset: earthquake
    path: data/processed/stpp/earthquake/events.csv
    model: DeepSTPP
    model_config:
      num_marks: auto
      hidden_dim: 128
      time_dim: 32
      num_layers: 2
  tkg:
    dataset: gdelt
    path: data/processed/tkg/gdelt/facts.csv
    model: xERTE
    model_config:
      num_entities: auto
      num_relations: auto
      hidden_dim: 128
      time_dim: 32
      expansion_layers: 2

need_score:
  # Components are computed from this experiment's own trained variants.
  # All domains include base, generic, open-path, correct-path, and shuffled
  # controls so that learned permission can be separated from path exposure.
  weights:
    path_reach_rel: 0.35
    correct_over_generic_rel: 0.25
    correct_over_shuffled_rel: 0.25
    correct_over_open_path_rel: 0.15

inputs:
  # Used only as the downstream target for correlation after WNS is computed.
  main_base_vs_warrant: experiments/main_benchmark/outputs/analysis/tables/base_vs_warrant.csv

plot:
  stem: warrant_need_score_vs_gain
  annotate_domains: true
